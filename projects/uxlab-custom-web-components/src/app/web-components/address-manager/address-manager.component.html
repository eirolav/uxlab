<div class="address-form-container">
    <div class="form-header">
        <h2>Address Information</h2>
        <p class="form-subtitle">Please enter your complete address details <button (click)="setFakeAddress($event)">Set Fake Address</button></p>
    </div>
    
    <form [formGroup]="addressForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
            <div class="form-group full-width">
                <label for="streetAddress">Street Address <span class="required">*</span></label>
                <input 
                    id="streetAddress" 
                    type="text" 
                    formControlName="streetAddress" 
                    [ngClass]="{'is-invalid': addressForm.get('streetAddress')?.invalid && addressForm.get('streetAddress')?.touched}">
                <div *ngIf="addressForm.get('streetAddress')?.invalid && addressForm.get('streetAddress')?.touched" class="error-message">
                    Street address is required.
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full-width">
                <label for="streetAddress2">Street Address Line 2 <span class="optional">(optional)</span></label>
                <input 
                    id="streetAddress2" 
                    type="text" 
                    formControlName="streetAddress2">
            </div>
        </div>

        <div class="form-row city-state-zip-row">
            <div class="form-group city-field">
                <label for="city">City <span class="required">*</span></label>
                <input 
                    id="city" 
                    type="text" 
                    formControlName="city"
                    [ngClass]="{'is-invalid': addressForm.get('city')?.invalid && addressForm.get('city')?.touched}">
                <div *ngIf="addressForm.get('city')?.invalid && addressForm.get('city')?.touched" class="error-message">
                    City is required.
                </div>
            </div>

            <div class="form-group state-field">
                <label for="state">State <span class="required">*</span></label>
                <select 
                    id="state" 
                    formControlName="state"
                    [ngClass]="{'is-invalid': addressForm.get('state')?.invalid && addressForm.get('state')?.touched}">
                    <option value="" disabled>Select One</option>
                    <option *ngFor="let state of states$ | async" [value]="state.code">
                        {{ state.code }} - {{ state.name }}
                    </option>
                </select>
                <div *ngIf="addressForm.get('state')?.invalid && addressForm.get('state')?.touched" class="error-message">
                    State is required.
                </div>
            </div>

            <div class="form-group zip-field">
                <label for="zipCode">Zip Code <span class="required">*</span></label>
                <input 
                    id="zipCode" 
                    type="text" 
                    formControlName="zipCode"
                    [ngClass]="{'is-invalid': addressForm.get('zipCode')?.invalid && addressForm.get('zipCode')?.touched}">
                <div *ngIf="addressForm.get('zipCode')?.invalid && addressForm.get('zipCode')?.touched" class="error-message">
                    <div *ngIf="addressForm.get('zipCode')?.errors?.['required']">Zip code is required.</div>
                    <div *ngIf="addressForm.get('zipCode')?.errors?.['pattern']">Zip code must be 5 digits.</div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" [disabled]="submitting" class="btn-submit">
                <span *ngIf="submitting" class="spinner"></span>
                <span>Submit Address</span>
            </button>
        </div>
    </form>
</div>
